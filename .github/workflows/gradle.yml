# Workflow 이름
name: realtimetrip

# 어떤 이벤트가 발생하면 workflow 실행할 지 명시
on:
  # main 브랜치에 push나 pull request 발생 시
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 위 이벤트 발생 시 실행될 작업들
jobs:
  build:
    # VM의실행 환경 지정 => 우분투 최신 버전
    runs-on: ubuntu-latest

    # 실행될 jobs를 순서대로 명시
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    # JDK 17 설치
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'corretto'
        
    # Gradle Build를 위한 권한 부여
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Gradle Build (test 제외)
    - name: Build with Gradle
      run: ./gradlew clean build --exclude-task test

    # DockerHub 로그인
    - name: DockerHub Login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    # Docker 이미지 빌드
    - name: Docker Image Build
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.PROJECT_NAME }} .

    # DockerHub Push
    - name: DockerHub Push
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.PROJECT_NAME }}

    # EC2에 docker-compose.yml 파일 복사
    - name: Copy docker-compose.yml to EC2
      uses: appleboy/scp-action@v0.1.5
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_KEY }}
        source: "docker-compose.yml"
        target: "~/realtimetrip"

    # EC2에 접속해 .env, application.yml 생성 + docker-compose 실행
    - name: Application Run
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          # .env 파일 생성
          echo "PORT=${{ secrets.PORT }}" > ~/realtimetrip/.env
          echo "DB_URL=${{ secrets.DB_URL }}" >> ~/realtimetrip/.env
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> ~/realtimetrip/.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> ~/realtimetrip/.env

          # application.yml 생성
          echo "${{ secrets.APPLICATION }}" > ~/realtimetrip/src/main/resources/application.yml

          # docker-compose 실행
          cd ~/realtimetrip
          sudo docker compose pull
          sudo docker compose down
          sudo docker compose up -d
